<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI 行业日报{% endblock %}</title>
  <meta name="description" content="每日自动聚合 AI 行业资讯，经 LLM 评分排序。">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="logo">AI <span class="accent">NEWS</span></a>
      <nav class="nav-links">
        <a href="/" class="{% if active == 'home' %}active{% endif %}">首页</a>
        <a href="/hot" class="{% if active == 'hot' %}active{% endif %}">热门</a>
        <a href="/history" class="{% if active == 'history' %}active{% endif %}">历史</a>
        <a href="/about" class="{% if active == 'about' %}active{% endif %}">关于</a>
      </nav>
      <div class="header-spacer"></div>
      {% if data and data.date_formatted %}
      <span class="header-date">{{ data.date_formatted }} · {{ data.weekday }}</span>
      {% endif %}
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">🌙</button>
    </div>
  </header>

  {% block body %}{% endblock %}

  <footer class="site-footer">
    <div class="site-footer-inner">
      <a href="/">AI NEWS</a>
      <span class="sep">·</span>
      <a href="/api/v1/ai_news/news">API</a>
      <span class="sep">·</span>
      <a href="/history">历史</a>
      <span class="sep">·</span>
      <a href="/about">关于</a>
      <span class="sep">·</span>
      <a href="/api/v1/ai_news/sources">信源状态</a>
    </div>
  </footer>

  {# 详情弹窗：卡片点击后从原位置放大到这里 #}
  <div id="detailModal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <button class="modal-back" type="button" aria-label="返回" hidden>←</button>
        <div class="modal-titles">
          <span class="modal-icon" id="modalIcon"></span>
          <span class="modal-kicker" id="modalKicker"></span>
        </div>
        <button class="modal-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script type="application/json" id="news-data">{{ (payload or {}) | tojson }}</script>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
